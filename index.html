<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeseva Directory</title>
    <style>
        /* మీ పాత స్టైల్స్ ఇక్కడ ఉంటాయి */
        body { font-family: Arial, sans-serif; padding: 20px; }
        .filter-buttons { margin-bottom: 20px; }
        .tool-card, .news-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="filter-buttons">
        <button onclick="filterTools('Job')">Jobs</button>
        <button onclick="filterTools('Result')">Results</button>
        <button onclick="filterTools('Document')">Documents</button>
        <button onclick="filterTools('HallTicket')">Hall Tickets</button>
    </div>

    <div id="tools-container"></div>
    <div id="news-container"></div>

    <script>
        const _PUB = "2PACX-1vS41Q9pp_LZJIADtQUHlr2Leshl0t_j8MJfyw4akayunKoBPX6b2inf0_Ll6guocxqNbgvN8n7IsMgX";

        const CONFIG = {
            listings: `https://docs.google.com/spreadsheets/d/e/${_PUB}/pub?gid=1466240074&single=true&output=csv`,
            news:     `https://docs.google.com/spreadsheets/d/e/${_PUB}/pub?gid=1476351555&single=true&output=csv`,
            tools:    `https://docs.google.com/spreadsheets/d/e/${_PUB}/pub?gid=680755007&single=true&output=csv`,
            schemes:  `https://docs.google.com/spreadsheets/d/e/${_PUB}/pub?gid=998929241&single=true&output=csv`
        };

        // CSV Parser
        function parseCSV(csvText) {
            const lines = csvText.split("\n");
            const headers = lines[0].split(",").map(h => h.trim());
            return lines.slice(1).map(line => {
                const values = line.split(",");
                let obj = {};
                headers.forEach((h, i) => obj[h] = values[i] ? values[i].trim() : "");
                return obj;
            });
        }

        // Tools Filter Logic
        function filterTools(category) {
            fetch(CONFIG.tools)
            .then(res => res.text())
            .then(text => {
                const data = parseCSV(text);
                const filtered = data.filter(item => item.Category === category);
                const container = document.getElementById('tools-container');
                container.innerHTML = `<h2>${category} List</h2>`;
                filtered.forEach(item => {
                    container.innerHTML += `
                        <div class="tool-card">
                            <h3>${item.Title}</h3>
                            <p>${item.Details}</p>
                            <a href="${item.Link}" target="_blank">మరింత సమాచారం</a>
                        </div>`;
                });
            });
        }

        // News Loader
        function loadNews() {
            fetch(CONFIG.news)
            .then(res => res.text())
            .then(text => {
                const data = parseCSV(text);
                const container = document.getElementById('news-container');
                container.innerHTML = '<h2>Latest News</h2>';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="news-card">
                            <h3>${item.Title}</h3>
                            <p>${item.Description}</p>
                        </div>`;
                });
            });
        }

        window.onload = () => { loadNews(); };
    </script>
</body>
</html>
