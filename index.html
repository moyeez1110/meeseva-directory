<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b8400a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>మీసేవ డైరెక్టరీ — Telangana</title>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="మీసేవ">
<meta name="application-name" content="మీసేవ డైరెక్టరీ">
<meta name="msapplication-TileColor" content="#c94b0a">
<meta name="msapplication-TileImage" content="icons/icon-144x144.png">

<link rel="apple-touch-icon" href="icons/icon-152x152.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ═══════════════════════════════════════════
   ROOT — MeeSeva Saffron+Green+Gold Theme
═══════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --saf:#c94b0a; --saf2:#e8610e; --saf3:#fde8d8; --saf4:#fff2ea;
  --grn:#1a7a3e; --grn2:#22a050; --grn3:#d4f0e1; --grn4:#edf9f3;
  --gld:#d4880a; --gld2:#f5a623; --gld3:#fef3cd;
  --bg:#fffcf8; --bg2:#fff7f0; --bg3:#fef0e3; --card:#ffffff;
  --line:#f0e4d8; --line2:#e2cdb8; --line3:#cdb090;
  --t1:#1a0f05; --t2:#4a3525; --t3:#8a6a55; --t4:#b89a85;
  --red:#dc2626; --redbg:#fef2f2; --blue:#1d4ed8; --bluebg:#eff6ff;
  --r:13px; --r2:9px; --r3:6px;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;color:var(--t1);line-height:1.5}

/* ═══════════════ APP SHELL ═══════════════ */
#app{display:flex;flex-direction:column;height:100dvh;max-width:440px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 0 60px rgba(200,75,10,.1)}

/* ═══════════════ SCREENS ═══════════════ */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.on{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:.5}to{opacity:1}}

/* ═══════════════ NEWS TICKER ═══════════════ */
.ticker-wrap{background:var(--grn);display:flex;align-items:center;overflow:hidden;flex-shrink:0;height:28px}
.ticker-label{background:var(--saf2);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.8px;padding:0 10px;height:100%;display:flex;align-items:center;white-space:nowrap;flex-shrink:0}
.ticker-scroll{flex:1;overflow:hidden}
.ticker-inner{display:inline-flex;white-space:nowrap;animation:ticker 45s linear infinite}
.ticker-inner:hover{animation-play-state:paused}
.ticker-item{font-size:11px;color:#fff;padding:0 18px;display:inline-flex;align-items:center;gap:6px;height:28px;border-right:1px solid rgba(255,255,255,.2)}
.ticker-item::before{content:'●';font-size:7px;color:var(--gld2)}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ═══════════════ TOP BAR ═══════════════ */
.top-bar{background:linear-gradient(135deg,#b8390a 0%,#c94b0a 55%,#d85f10 100%);padding:10px 14px 9px;flex-shrink:0;box-shadow:0 2px 14px rgba(200,75,10,.3)}
.tb-r1{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.ms-brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.ms-logo{width:36px;height:36px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ms-logo svg{width:22px;height:22px;fill:#fff}
.ms-n1{font-size:16px;font-weight:800;color:#fff;letter-spacing:.2px;line-height:1}
.ms-n2{font-size:9px;color:rgba(255,255,255,.65);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.tb-icons{display:flex;gap:7px}
.tb-ico{width:32px;height:32px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;position:relative}
.tb-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--gld2);border-radius:50%;border:1.5px solid #c94b0a}
.tb-srch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:var(--r2);padding:0 12px;backdrop-filter:blur(4px)}
.tb-srch svg{width:14px;height:14px;stroke:rgba(255,255,255,.8);fill:none;stroke-width:2;flex-shrink:0}
.tb-srch input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:13px;padding:8px 0;font-family:inherit}
.tb-srch input::placeholder{color:rgba(255,255,255,.55)}

/* ═══════════════ SCROLL BODY ═══════════════ */
.scroll-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.scroll-body::-webkit-scrollbar{width:2px}
.scroll-body::-webkit-scrollbar-thumb{background:var(--line2)}

/* ═══════════════ VISITOR BANNER ═══════════════ */
.vis-banner{background:linear-gradient(90deg,var(--grn) 0%,var(--grn2) 100%);padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
.vb-l{display:flex;align-items:center;gap:9px}
.vb-l svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;flex-shrink:0}
.vb-label{font-size:10.5px;color:rgba(255,255,255,.8);margin-bottom:1px}
.vb-num{font-size:22px;font-weight:800;color:#fff;line-height:1}
.vb-sub{font-size:9.5px;color:rgba(255,255,255,.65)}
.vb-r{text-align:right}
.vb-rt{font-size:10px;color:rgba(255,255,255,.65)}
.vb-rv{font-size:12px;color:#fff;font-weight:600;margin-top:2px}

/* ═══════════════ STATS ROW ═══════════════ */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:11px 11px 0}
.stat-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;text-align:center;box-shadow:0 1px 5px rgba(200,75,10,.06)}
.stat-n{font-size:22px;font-weight:800;color:var(--saf2)}
.stat-n.g{color:var(--grn)}
.stat-n.gold{color:var(--gld)}
.stat-l{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* ═══════════════ SECTION HEADER ═══════════════ */
.sec{padding:14px 12px 0}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--t1)}
.sec-bar{width:4px;height:18px;background:var(--saf2);border-radius:4px}
.sec-more{font-size:12px;color:var(--saf2);cursor:pointer;font-weight:500}

/* ═══════════════ QUICK CATEGORY GRID ═══════════════ */
.qcat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.qcat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 6px;text-align:center;cursor:pointer;transition:.13s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.qcat:active{transform:scale(.94)}
.qcat-em{font-size:23px;margin-bottom:4px}
.qcat-lb{font-size:10.5px;color:var(--t2);font-weight:500;line-height:1.2}

/* ═══════════════ NOTIFICATION CARD ═══════════════ */
.hor-scroll{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hor-scroll::-webkit-scrollbar{display:none}

/* ═══ DETAIL DRAWER ═══ */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.detail-overlay.on{opacity:1;pointer-events:all}
.detail-drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(102%);width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;border-top:1.5px solid var(--line2);z-index:310;transition:transform .32s cubic-bezier(.32,0,.2,1);max-height:92dvh;overflow-y:auto;display:flex;flex-direction:column}
.detail-drawer::-webkit-scrollbar{display:none}
.detail-drawer.on{transform:translateX(-50%) translateY(0)}
.dd-handle{width:36px;height:4px;background:var(--line2);border-radius:4px;margin:12px auto 0;flex-shrink:0}
.dd-header{padding:12px 16px 10px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dd-badge{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.dd-badge.news{background:var(--saf3);color:var(--saf)}
.dd-badge.notif{background:var(--redbg);color:var(--red)}
.dd-badge.notif-a{background:#eff6ff;color:#1d4ed8}
.dd-badge.scheme{background:var(--grn3);color:var(--grn)}
.dd-badge.video{background:#ffecec;color:#cc0000}
.dd-title{font-size:16px;font-weight:700;color:var(--t1);line-height:1.35;margin-bottom:4px}
.dd-date{font-size:11.5px;color:var(--t3)}
.dd-close{width:30px;height:30px;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--t2);flex-shrink:0;font-family:inherit}
.dd-thumb{width:100%;aspect-ratio:16/9;background:var(--bg3);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:52px}
.dd-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dd-video-outer{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.dd-video-outer iframe{width:100%;height:100%;border:none;display:block}
.dd-play-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);cursor:pointer;flex-direction:column;gap:8px}
.dd-play-btn svg{width:52px;height:52px;fill:rgba(255,255,255,.9)}
.dd-play-lbl{font-size:12px;color:rgba(255,255,255,.85);font-weight:600}
.dd-body{padding:14px 16px 8px;flex:1}
.dd-desc{font-size:14px;color:var(--t2);line-height:1.85;margin-bottom:14px;white-space:pre-wrap}
.dd-sec-title{font-size:10px;color:var(--t3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding-bottom:7px;margin-bottom:10px;border-bottom:1.5px solid var(--line)}
.dd-info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.dd-info-ico{font-size:17px;width:22px;flex-shrink:0;margin-top:1px}
.dd-info-main{font-size:13.5px;color:var(--t1);line-height:1.45}
.dd-info-sub{font-size:11.5px;color:var(--t3);margin-top:1px}
.dd-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dd-tag{background:var(--bg2);border:1px solid var(--line2);color:var(--t2);border-radius:20px;padding:4px 11px;font-size:12px}
.dd-actions{padding:12px 16px calc(env(safe-area-inset-bottom,0px)+14px);border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0}
.dd-btn-p{flex:1;background:var(--saf2);border:none;color:#fff;border-radius:var(--r2);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}
.dd-btn-p.green{background:var(--grn)}
.dd-btn-s{background:var(--bg2);border:1.5px solid var(--line2);color:var(--t2);border-radius:var(--r2);padding:13px 16px;font-size:13px;cursor:pointer;font-family:inherit}

.notif-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;min-width:175px;cursor:pointer;flex-shrink:0;border-left:3px solid var(--saf2);box-shadow:0 1px 5px rgba(0,0,0,.05);transition:transform .12s}
.notif-card:active{transform:scale(.97)}
.notif-card.grn{border-left-color:var(--grn2)}
.notif-card.gld{border-left-color:var(--gld2)}
.nc-type{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:600}
.nc-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.3}
.nc-date{font-size:11px;color:var(--t3)}

/* ═══════════════ SCHEME CARD ═══════════════ */
.scheme-card{background:linear-gradient(135deg,var(--grn) 0%,#1a6a32 100%);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(26,122,62,.2);transition:.15s}
.scheme-card:active{transform:scale(.99)}
.sc-ico{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sc-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:2px}
.sc-desc{font-size:11.5px;color:rgba(255,255,255,.8)}
.sc-arr{margin-left:auto;color:rgba(255,255,255,.5);flex-shrink:0}
.sc-arr svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}

/* ═══════════════ NEWS CARD ═══════════════ */
.news-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.05);transition:.13s}
.news-card:active{transform:scale(.99)}
.nc-thumb{width:100%;height:140px;overflow:hidden;position:relative;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:42px}
.nc-thumb img{width:100%;height:100%;object-fit:cover}
.nc-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.nc-play svg{width:44px;height:44px;fill:rgba(255,255,255,.9)}
.nc-badge{position:absolute;top:8px;left:8px;background:var(--saf2);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.3px}
.nc-badge.video{background:#cc0000}
.nc-body{padding:10px 12px 11px}
.nc-cat{font-size:10px;color:var(--grn);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.nc-ttl覆{font-size:13.5px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.4}
.nc-desc2{font-size:12.5px;color:var(--t2);margin-bottom:5px;line-height:1.6}
.nc-dt{font-size:11px;color:var(--t3)}

/* ═══════════════ CONTACT STRIP ═══════════════ */
.contact-strip{background:linear-gradient(90deg,#b8390a,#c94b0a);margin:12px;border-radius:var(--r);padding:13px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 3px 14px rgba(200,75,10,.2)}
.cs-ico{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cs-ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8}
.cs-lbl{font-size:10px;color:rgba(255,255,255,.7);margin-bottom:2px}
.cs-val{font-size:13.5px;font-weight:700;color:#fff}

/* ═══════════════ PAGE HEADER ═══════════════ */
.page-hdr{background:var(--bg2);border-bottom:1px solid var(--line);padding:11px 13px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.ph-ico{width:36px;height:36px;background:var(--saf3);border:1px solid var(--line2);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ph-ico svg{width:18px;height:18px;stroke:var(--saf2);fill:none;stroke-width:1.8;stroke-linecap:round}
.ph-title{font-size:15px;font-weight:700;color:var(--t1)}
.ph-sub{font-size:11px;color:var(--t3);margin-top:1px}

/* ═══════════════ DIRECTORY FILTERS ═══════════════ */
.dir-top{background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 12px;flex-shrink:0}
.dir-srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r2);padding:0 12px;margin-bottom:9px}
.dir-srch svg{width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:2;flex-shrink:0}
.dir-srch input{flex:1;background:none;border:none;outline:none;color:var(--t1);font-size:13px;padding:9px 0;font-family:inherit}
.dir-srch input::placeholder{color:var(--t4)}
.dir-f2{display:flex;gap:7px}
.df-sel{flex:1;background:var(--card);border:1.5px solid var(--line2);color:var(--t2);border-radius:var(--r3);padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none;appearance:none}
.df-sel:focus{border-color:var(--saf2)}

/* ═══════════════ FILTER PILLS ═══════════════ */
.fpills{display:flex;gap:5px;padding:7px 12px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.fpills::-webkit-scrollbar{display:none}
.fpill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line2);color:var(--t3);border-radius:20px;padding:4px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.fpill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.fpill.act{background:var(--saf3);border-color:var(--saf2);color:var(--saf);font-weight:500}
.fpill.act::after{content:' ✕';font-size:9.5px;color:var(--saf)}

/* ═══════════════ RESULTS BAR ═══════════════ */
.res-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;flex-shrink:0}
.rc{font-size:12px;color:var(--t3)}
.rc b{color:var(--saf2);font-weight:600}
.vt-row{display:flex;gap:4px}
.vt{width:28px;height:28px;background:var(--card);border:1px solid var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3)}
.vt svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.vt.on{background:var(--saf3);border-color:var(--saf2);color:var(--saf2)}

/* ═══════════════ LISTINGS BODY ═══════════════ */
.lst-body{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:160px;
}
.lst-body::-webkit-scrollbar{width:2px}
.lst-body::-webkit-scrollbar-thumb{background:var(--line2)}

/* FAB */
.dir-fab{
  position:fixed;
  bottom:calc(62px + env(safe-area-inset-bottom,0px) + 12px);
  right:16px;
  z-index:190;
  background:var(--saf2);
  color:#fff;border:none;border-radius:50px;
  padding:13px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  box-shadow:0 4px 20px rgba(200,75,10,.4);
  transition:transform .15s;white-space:nowrap;
}
.dir-fab:active{transform:scale(.95)}
.dir-fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;flex-shrink:0}

/* Drawers */
.adv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:210;opacity:0;pointer-events:none;transition:opacity .25s}
.adv-overlay.on{opacity:1;pointer-events:all}
.adv-drawer{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(102%);
  width:100%;max-width:440px;
  background:var(--card);
  border-radius:20px 20px 0 0;
  border-top:1.5px solid var(--line2);
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  z-index:220;
  transition:transform .32s cubic-bezier(.32,0,.2,1);
  max-height:88dvh;overflow-y:auto;
}
.adv-drawer::-webkit-scrollbar{display:none}
.adv-drawer.on{transform:translateX(-50%) translateY(0)}
.adv-lbl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.adv-sel{width:100%;background:var(--bg2);border:1.5px solid var(--line2);color:var(--t1);border-radius:var(--r2);padding:9px 10px;font-size:13px;font-family:inherit;outline:none;appearance:none}
.adv-sel:focus{border-color:var(--saf2)}
.adv-sel option{background:var(--card)}
.adv-inp{width:100%;background:var(--bg2);border:1.5px solid var(--line2);color:var(--t1);border-radius:var(--r2);padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none}
.adv-inp:focus{border-color:var(--saf2)}
.ms-card.custom-card{border-color:var(--saf2);border-width:1.5px}
.ml-item.custom-item{border-color:var(--saf2);border-width:1.5px}

/* ═══════════════ GRID CARDS ═══════════════ */
.ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:4px 10px}
.ms-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .12s;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.ms-card:hover{border-color:var(--saf2);box-shadow:0 3px 14px rgba(200,75,10,.12)}
.ms-card:active{transform:scale(.97)}
.mc-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative;background:var(--saf3);display:flex;align-items:center;justify-content:center}
.mc-img img{width:100%;height:100%;object-fit:cover;display:block}
.mc-av{font-size:30px;font-weight:800;color:var(--saf);width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.mc-trusted{position:absolute;top:6px;left:6px;background:var(--grn);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;display:flex;align-items:center;gap:3px}
.mc-trusted svg{width:9px;height:9px;fill:#fff;stroke:none}
.mc-rated{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:var(--gld2);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.mc-verified{position:absolute;bottom:6px;right:6px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
.mc-body{padding:8px 9px 8px}
.mc-name{font-size:12.5px;font-weight:700;color:var(--t1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-mandal{font-size:11px;color:var(--grn);font-weight:600;margin-bottom:2px}
.mc-dist"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${d.Village||""} · ${(d.District||"").split(" ")[0]}</div>
          <div class="mc-btns">
            <button class="mc-call" data-tel="${d.Phone}">📞 కాల్</button>
            ${d.WhatsApp?`<button class="mc-wa" data-wa="${d.WhatsApp}">💬 WA</button>`:""}
          </div>
          ${d.isCustom?`<button onclick="deleteCustomListing(${d.id})" style="width:100%;margin-top:5px;background:var(--redbg);border:1px solid #fca5a5;color:var(--red);border-radius:6px;padding:5px;font-size:10.5px;cursor:pointer;font-family:inherit">🗑️ Delete</button>`:""}
        </div>
      </div>`).join("")}</div>`;
  }else{
    wrap.innerHTML=`<div class="ms-list">${data.map(d=>`
      <div class="ml-item" data-id="${d.id}">
        <div class="ml-av">${d.Photo?`<img src="${d.Photo}" loading="lazy" onerror="this.style.display='none'">`:""}<span style="${d.Photo?"display:none":""}">${(d.Name||"?").charAt(0)}</span></div>
        <div class="ml-info">
          <div class="ml-name">${d.Name}</div>
          <div class="ml-bdgs">
            ${trusted(d)?`<span class="bdg-t"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Trusted</span>`:""}
            ${rat(d)>0?`<span class="bdg-r">★${rat(d)}</span>`:""}
            ${verified(d)?`<span class="bdg-v">✓ Verified</span>`:""}
          </div>
          <div class="ml-loc">📍 ${d.Village||""}, ${d.Mandal} · ${(d.District||"").split(" ")[0]}</div>
        </div>
        <button class="ml-call" data-tel="${d.Phone}"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></button>
      </div>`).join("")}</div>`;
  }
}

/* ══ PROFILE ══ */
let _galIdx = 0, _galSlides = [];

function openProfile(id){
  const d = ALL.find(x=>x.id===id); if(!d) return;
  PP_D = d;
  document.getElementById("ppTitle").textContent = d.Name;
  const tr  = d.Trusted==="true"||d.Trusted===true;
  const vr  = d.Verified==="true"||d.Verified===true;
  const rt  = parseFloat(d.Rating)||0;
  const lat = parseFloat(d.Lat), lng = parseFloat(d.Lng), hasMap = lat&&lng;
  const svcs = (d.Services||"").split(",").map(s=>s.trim()).filter(Boolean);

  _galSlides = [];
  const photos = (d.Photos||d.Photo||"").split(",").map(s=>s.trim()).filter(Boolean);
  const ytIds  = (d.Videos||"").split(",").map(s=>s.trim()).filter(Boolean);
  photos.forEach(p => _galSlides.push({type:"img", src:p}));
  ytIds.forEach(v  => _galSlides.push({type:"yt",  id:v}));
  if(!_galSlides.length) _galSlides.push({type:"av", letter:(d.Name||"?").charAt(0)});
  _galIdx = 0;

  const galHTML = buildGallery(_galSlides, tr, rt, vr);

  const offers = parseOffers(d.Offers||"");
  const offersHTML = offers.length ? `
    <div style="margin-bottom:18px">
      <div class="pp-sec-t">🎁 fragile ప్రత్యేక ఆఫర్లు</div>
      ${offers.map(o=>`
        <div class="offer-card">
          <div class="offer-card-ico">${o.emoji}</div>
          <div style="flex:1">
            <div class="offer-card-title">${o.title}</div>
            ${o.desc?`<div class="offer-card-desc">${o.desc}</div>`:""}
            ${o.exp?`<div class="offer-card-exp">⏰ Valid till: ${o.exp}</div>`:""}
          </div>
        </div>`).join("")}
    </div>` : "";

  const upiId  = (d.UPI||"").trim();
  const upiQR  = (d.UPIID||d.QRCode||"").trim(); 
  const upiName= (d.UPIName||d.Name||"").trim();
  const upiHTML = upiId ? `
    <div style="margin-bottom:18px">
      <div class="pp-sec-t">💸 Payment / UPI</div>
      <div class="upi-box">
        ${upiQR?`<div class="upi-qr"><img src="${upiQR}" alt="QR Code" onerror="this.parentElement.style.display='none'"></div>`:`<div style="font-size:42px;margin-bottom:10px">📱</div>`}
        <div class="upi-id">${upiId}</div>
        <div class="upi-name">${upiName}</div>
        <button class="upi-copy" onclick="copyUPI('${upiId}')">📋 UPI ID Copy చేయండి</button>
      </div>
    </div>` : "";

  document.getElementById("ppContent").innerHTML = `
    ${galHTML}
    <div class="pp-body">
      <div class="pp-name">${d.Name}</div>
      <div class="pp-tags">
        <span class="pp-tag"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${d.Village||""}</span>
        <span class="pp-tag">🏛️ ${d.Mandal}</span>
        <span class="pp-tag">📍 ${(d.District||"").split(" ")[0]}</span>
        ${rt>0?`<span class="pp-tag" style="background:var(--gld3);border-color:var(--gld2);color:var(--gld)">★ ${rt}/5</span>`:""}
        ${tr?`<span class="pp-tag" style="background:var(--grn3);border-color:var(--grn2);color:var(--grn)">✅ Trusted</span>`:""}
        ${vr?`<span class="pp-tag" style="background:#eff6ff;border-color:#93c5fd;color:var(--blue)">✓ Verified</span>`:""}
      </div>

      ${offersHTML}

      <div class="pp-sec-t">సంప్రదించండి</div>
      <div class="pp-row">
        <div class="pp-ico"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></div>
        <div class="pp-val"><div class="v1">${d.Phone}</div><div class="v2">Phone నంబర్</div></div>
      </div>
      ${d.WhatsApp?`<div class="pp-row"><div class="pp-ico g"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="pp-val"><div class="v1">${d.WhatsApp}</div><div class="v2">WhatsApp</div></div></div>`:""}
      <div class="pp-row">
        <div class="pp-ico"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div class="pp-val"><div class="v1">${d.Address||""}</div><div class="v2">${d.Village||""}, ${d.Mandal}, ${d.District}</div></div>
      </div>
      ${d.Hours?`<div class="pp-row"><div class="pp-ico gld"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="pp-val"><div class="v1">${d.Hours}</div><div class="v2">పని వేళలు</div></div></div>`:""}
      ${d.Email?`<div class="pp-row"><div class="pp-ico pur"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div class="pp-val"><div class="v1">${d.Email}</div><div class="v2">Email</div></div></div>`:""}
      ${d.Website?`<div class="pp-row"><div class="pp-ico pur"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div><div class="pp-val"><div class="v1"><a href="${d.Website}" target="_blank" style="color:var(--saf2);text-decoration:none">${d.Website}</a></div><div class="v2">Website</div></div></div>`:""}

      ${upiHTML}

      ${svcs.length?`<div style="margin-bottom:18px"><div class="pp-sec-t">అందించే సేవలు (${svcs.length})</div><div class="svc-wrap">${svcs.map(s=>`<div class="svc-chip">✓ ${s}</div>`).join("")}</div></div>`:""}

      ${d.Description?`<div style="margin-bottom:18px"><div class="pp-sec-t">గురించి</div><p style="font-size:13.5px;color:var(--t2);line-height:1.75">${d.Description}</p></div>`:""}

      <div style="margin-bottom:18px">
        <div class="pp-sec-t">Rating ఇవ్వండి</div>
        <div class="star-row" id="starRow">
          ${[1,2,3,4,5].map(i=>`<svg class="star${i<=rt?" on":""}" viewBox="0 0 24 24" onclick="rateC(${d.id},${i})"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`).join("")}
          <span class="rate-lbl">${rt>0?rt+" / 5":"Rate this center"}</span>
        </div>
      </div>

      ${hasMap?`<div style="margin-bottom:4px"><div class="pp-sec-t">లొకేషన్ మ్యాప్</div><div class="pp-map" id="ppMapEl"></div></div>`:""}
    </div>`;

  document.getElementById("ppFoot").style.display = "flex";
  document.getElementById("ppFoot").innerHTML = `
    <button class="pp-btn-c" data-tel="${d.Phone}">
      <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svgకాల్ చేయండి</button>
    ${d.WhatsApp?`<button class="pp-btn-w" data-wa="${d.WhatsApp}">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>WhatsApp</button>`:""}
    ${upiId?`<button class="pp-btn-upi" onclick="scrollToUPI()">💸 Pay</button>`:""}`;

  document.getElementById("profilePg").className = "profile on";
  document.getElementById("profilePg").scrollTop = 0;

  if(hasMap){ setTimeout(()=>{
    if(PP_M){PP_M.remove();PP_M=null;}
    PP_M = L.map("ppMapEl").setView([lat,lng],15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM"}).addTo(PP_M);
    L.marker([lat,lng],{icon:L.divIcon({html:`<div style="background:var(--saf2);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(200,75,10,.4)">${(d.Name||"?").charAt(0)}</div>`,className:"",iconSize:[34,34],iconAnchor:[17,17]})})
      .addTo(PP_M).bindPopup(`<b>${d.Name}</b><br>${d.Address}`).openPopup();
  },160);}
}

async function init(){
  const splashTimer = setTimeout(hideSplash, 4000);

  try {
    updateVisitors();

    async function fetchSheet(url){
      if(!url || url.includes("YOUR_")) return null;
      try{
        const ctrl = new AbortController();
        const t = setTimeout(()=>ctrl.abort(), 5000);
        const r = await fetch(url, {signal: ctrl.signal});
        clearTimeout(t);
        if(!r.ok) throw new Error();
        return parseCSV(await r.text());
      } catch(e){ return null; }
    }

    ALL = DEMO; // Default Fallback

    const dEl=document.getElementById("fDist"),jEl=document.getElementById("jf_dist");
    Object.keys(TGD).forEach(d=>{
        if(dEl) dEl.innerHTML+=`<option value="${d}">${d}</option>`;
        if(jEl) jEl.innerHTML+=`<option value="${d}">${d}</option>`;
    });
    
    const afEl=document.getElementById("af-dist");
    if(afEl) Object.keys(TGD).forEach(d=>{afEl.innerHTML+=`<option value="${d}">${d}</option>`;});

    const customs  = loadCustomListings();
    const approved = loadApprovedListings();
    if(customs.length)  ALL = [...ALL, ...customs];
    if(approved.length) ALL = [...ALL, ...approved];

    const vt = ALL.filter(d=>d.Trusteddisabled==="true"||d.Trusted===true).length;
    if(document.getElementById("stC")) document.getElementById("stC").textContent = ALL.length;
    if(document.getElementById("stV")) document.getElementById("stV").textContent = vt;
    if(document.getElementById("aT")) document.getElementById("aT").textContent  = ALL.length;
    if(document.getElementById("aV")) document.getElementById("aV").textContent  = vt;
    if(document.getElementById("aP")) document.getElementById("aP").textContent  = 0;

    renderTicker(); renderHomeNotifs(); renderSchemes(); renderHomeNews(); renderHomeRecent();
    renderTools(); renderForms(); renderNotifTypes(); renderNewsAll(); renderSvcChecks();
    populateCenterDropdown();
    
    if(document.getElementById("dirLoader")) document.getElementById("dirLoader").style.display = "none";
    if(document.getElementById("lstWrap")) document.getElementById("lstWrap").style.display   = "";
    applyF();

  } catch(err) {
    console.error("init error:", err);
  } finally {
    clearTimeout(splashTimer);
    hideSplash();
  }
}

/* ── Auxiliary Functions ── */
function parseCSV(t){
  const ls=t.trim().split("\n");
  const h=csvSpl(ls[0]).map(x=>x.trim().replace(/^"|"$/g,""));
  return ls.slice(1).map(l=>{const v=csvSpl(l);const o={};h.forEach((k,i)=>{o[k]=(v[i]||"").trim().replace(/^"|"$/g,"");});return o;}).filter(r=>r.Name);
}
function csvSpl(l){const r=[];let c="",q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c);c="";}else{c+=ch;}}r.push(c);return r;}

function updateVisitors(){
  const today=new Date().toDateString();
  const s=JSON.parse(localStorage.getItem("ms_v")||"{}");
  if(s.d!==today){s.d=today;s.t=0;s.total=s.total||0;}
  s.t++;s.total++;
  localStorage.setItem("ms_v",JSON.stringify(s));
  if(document.getElementById("visCount")) document.getElementById("visCount").textContent=s.t.toLocaleString();
  if(document.getElementById("visTotal")) document.getElementById("visTotal").textContent=s.total.toLocaleString();
  if(document.getElementById("visTime")) document.getElementById("visTime").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

function buildGallery(slides, tr, rt, vr){
  if(slides.length===1 && slides[0].type==="av"){
    return `<div class="pp-gallery" style="position:relative">
      <div class="pp-gallery-av">${slides[0].letter}</div>
      <div class="pp-hbdgs">
        ${tr?`<div class="pbdg-t"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Trusted</div>`:""}
        ${rt>0?`<div class="pbdg-r">★ ${rt}</div>`:""}
        ${vr?`<div class="pbdg-v">✓ Verified</div>`:""}
      </div>
    </div>`;
  }
  const slidesHTML = slides.map((s,i)=>{
    if(s.type==="img") return `<div class="pp-gallery-slide"><img src="${s.src}" loading="lazy" onclick="openLightbox('${s.src}')" style="cursor:zoom-in" onerror="this.parentElement.style.display='none'"><div class="pp-gal-type">📷 PHOTO</div></div>`;
    if(s.type==="yt")  return `<div class="pp-gallery-slide"><iframe class="pp-yt" src="https://www.youtube.com/embed/${s.id}?rel=0&modestbranding=1" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe><div class="pp-gal-type">▶ VIDEO</div></div>`;
    return `<div class="pp-gallery-slide"><div class="pp-gallery-av">${s.letter}</div></div>`;
  }).join("");
  const dotsHTML = slides.length>1 ? `<div class="pp-gal-dots">${slides.map((_,i)=>`<button class="pp-gal-dot${i===0?" on":""}" onclick="galTo(${i})"></button>`).join("")}</div>` : "";
  const arrowsHTML = slides.length>1 ? `
    <button class="pp-gal-prev" onclick="galMove(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="pp-gal-next" onclick="galMove(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>` : "";
  return `<div class="pp-gallery" id="ppGallery">
    <div class="pp-gallery-track" id="ppGalTrack">${slidesHTML}</div>
    ${arrowsHTML}${dotsHTML}
    <div class="pp-hbdgs">
      ${tr?`<div class="pbdg-t"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Trusted</div>`:""}
      ${rt>0?`<div class="pbdg-r">★ ${rt}</div>`:""}
      ${vr?`<div class="pbdg-v">✓ Verified</div>`:""}
    </div>
  </div>`;
}

function galMove(dir){
  _galIdx = (_galIdx + dir + _galSlides.length) % _galSlides.length;
  galTo(_galIdx);
}
function galTo(idx){
  _galIdx = idx;
  const track = document.getElementById("ppGalTrack");
  if(track) track.style.transform = `translateX(-${idx*100}%)`;
  document.querySelectorAll(".pp-gal-dot").forEach((d,i)=>d.className="pp-gal-dot"+(i===idx?" on":""));
}

function parseOffers(raw){
  if(!raw.trim()) return [];
  return raw.split(";").map(s=>s.trim()).filter(Boolean).map(o=>{
    const parts = o.split("|").map(p=>p.trim());
    const titlePart = parts[0]||"";
    const emojiMatch = titlePart.match(/^([\u{1F300}-\u{1FAFF}🎁🎉🔥💥⚡🏷️✨🌟💯🆓]+)/u);
    const emoji = emojiMatch ? emojiMatch[1] : "🎁";
    const title = emojiMatch ? titlePart.slice(emoji.length).trim() : titlePart;
    const desc  = parts[1]||"";
    const expRaw = parts.find(p=>/valid/i.test(p))||"";
    const exp   = expRaw.replace(/valid\s*:/i,"").trim();
    return {emoji, title, desc, exp};
  });
}

let _gsx=0, _sx=0;
document.getElementById("profilePg").addEventListener("touchstart",e=>{

}, {passive:true});

document.getElementById("profilePg").addEventListener("touchend",e=>{

const SVC_CATS = {
  "📜 Certificates": ["Income Certificate","Caste Certificate","Residence Certificate","Date of Birth Certificate"],
  "🪪 Identity & Documents": ["Aadhaar Services","PAN Card","Passport","Driving Licence","Ration Card"],
  "🏡 Land & Revenue": ["Land Records (Pahani)","Registration Services"]
};

let customServices = [];

function renderSvcChecks(){
  const wrap = document.getElementById("svcCatWrap"); if(!wrap) return;
  wrap.innerHTML = "";
  Object.entries(SVC_CATS).forEach(([cat, services])=>{
    const catDiv = document.createElement("div");
    catDiv.innerHTML = `<div class="svc-cat-title">${cat}</div><div class="svc-chk-grid">${
      services.map(s=>`
        <label class="svc-chk" onclick="toggleSvc(this)">
          <input type="checkbox" value="${s}" style="pointer-events:none"> ${s}
        </label>`).join("")
    }</div>`;
    wrap.appendChild(catDiv);
  });
  updateSvcCount();
}

function toggleSvc(label){
  const chk = label.querySelector("input");
  chk.checked = !chk.checked;
  label.className = chk.checked ? "svc-chk checked" : "svc-chk";
  updateSvcCount();
}

function addCustomSvc(){
  const inp = document.getElementById("customSvc"); if(!inp) return;
  const val = inp.value.trim();
  if(!val){ showToast("⚠️ Service పేరు type చేయండి"); return; }
  if(customServices.includes(val)){ showToast("ఈ service already add అయింది"); inp.value=""; return; }
  customServices.push(val);
  renderCustomTags();
  inp.value = "";
  updateSvcCount();
}
function removeCustomSvc(idx){
  customServices.splice(idx,1);
  renderCustomTags();
  updateSvcCount();
}
function renderCustomTags(){
  if(document.getElementById("customSvcList")) document.getElementById("customSvcList").innerHTML = customServices.map((s,i)=>
    `<span class="custom-tag">${s} <button onclick="removeCustomSvc(${i})">×</button></span>`
  ).join("");
}
function updateSvcCount(){
  const checked = document.querySelectorAll("#svcCatWrap input:checked").length;
  const total = checked + customServices.length;
  const el = document.getElementById("svcSelectedCount");
  if(el) el.textContent = total > 0 ? `✅ ${total} సేవలు selected` : "0 సేవలు selected";
}

function getFilt(){
  const q       = (document.getElementById("dq").value||"").toLowerCase().trim();
  const dist    = document.getElementById("fDist").value || document.getElementById("af-dist").value;
  const mandal  = document.getElementById("fMandal").value || document.getElementById("af-mandal").value;
  const centerF = document.getElementById("fCenter") ? document.getElementById("fCenter").value : "";
  return ALL.filter(d=>{
    if(q && !(d.Name||"").toLowerCase().includes(q)) return false;
    if(dist    && d.District !== dist)   return false;
    if(mandal  && d.Mandal   !== mandal) return false;
    if(centerF && d.Name     !== centerF) return false;
    return true;
  });
}
